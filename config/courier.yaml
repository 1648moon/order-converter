# 택배 접수용 파일 생성 규칙. 코드 수정 없이 여기서 추가/수정한다.

# 출력 헤더 (순서 그대로)
headers: [받는분, 주소, 상세주소, 운송장번호, 고객사주문번호, 우편번호, 도착영업소, 전화번호, 기타전화번호,
          선불후불, 품목명, 수량, 포장상태, 가로, 세로, 높이, 무게, 개별단가, 배송운임, 기타운임, 별도운임,
          할증운임, 도서운임, 메모]

# 파일 양식: input에서 받은 템플릿 (열 너비, 행 높이, 헤더·조건부 서식 등)
template: templates/택배용템플릿.xlsx

# 모든 행에 같은 값이 들어가는 항목
fixed:
  선불후불: "선불"
  수량: 1
  포장상태: "박스"
  기타운임: 100
  개별단가: 100

# 중간파일의 컬럼을 그대로 가져오는 항목 (출력 헤더: 중간파일 헤더)
# '받는분'은 중간파일의 '수령자' 다음 헤더 없는 컬럼(이름(주소3자))에서 가져온다.
copy:
  주소: 주소
  우편번호: 우편번호
  품목명: 상품명
  메모: 배송메모

# 배송운임: 공장 전달용 파일의 택배운임과 같은 값 (규칙은 config/factory.yaml shipping_rules)

# 전화번호/기타전화번호: 둘 다 같은 수령인 번호. 앞에 있는 컬럼부터 값이 있는 것을 사용
phone_sources: [수령자휴대전화, 수령자전화번호]

# 나머지 헤더(상세주소, 운송장번호, 고객사주문번호, 도착영업소, 가로, 세로, 높이, 무게,
# 별도운임, 할증운임, 도서운임)는 빈칸으로 둔다.
