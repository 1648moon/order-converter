# 내부보관용 파일 생성 규칙. 코드 수정 없이 여기서 추가/수정한다.

# 왼쪽 표의 헤더 (순서 그대로). 사용 가능한 항목:
#   접수일자, 송장번호, 상품명, 수화주명, 주문량, 상품옵션,
#   우편번호(=우편번호), 수화주주소(=주소), 수화주전화(=수령자전화번호), 수화주휴대폰(=수령자휴대전화)  <- 중간파일 값 그대로
headers: [접수일자, 송장번호, 상품명, 수화주명, 우편번호, 수화주주소, 수화주전화, 수화주휴대폰, 주문량, 상품옵션]

# 접수일자: 중간파일의 이 컬럼들 중 앞에서부터 값이 있는 것을 사용 (yy.mm.dd / yyyymmdd / yyyy-mm-dd ...)
date_sources: ["주문일(약식)", "주문일자(yyyyMMdd)", "주문일시"]
date_check_source: "주문일자(yyyyMMdd)"   # 검증용: 다른 컬럼의 날짜와 교차 확인
date_format: "yyyy-mm-dd"                  # 엑셀 표시 형식 (값은 실제 날짜)

# 상품옵션: 조립 상품이면 factory.yaml 의 assembled_marker(100%조립요청), 아니면 빈칸

# 오른쪽 집계표: 상품명 앞부분이 목록과 일치하는 행 수를 COUNTIF로 센다 (예시 문서와 같은 방식).
# 목록에 없는 상품이 주문에 있으면 경고가 나오니, 새 상품은 여기에 추가한다.
