# 공장 전달용 파일 생성 규칙. 코드 수정 없이 여기서 추가/수정한다.

# 출력 헤더 (순서 그대로)
headers: [받는고객, 우편번호, 받는고객주소, 전화번호, 핸드폰번호, 수량, 택배운임, 결제조건, 상품명, 상품옵션, 비고]

# 조립 여부 판단: 중간파일의 '선택사항'에 이 문구가 들어 있으면 조립 상품
assembled_marker: "100%조립요청"

# 파일 양식: input에서 받은 템플릿 (열 너비, 행 높이, 헤더·조건부 서식 등)
template: templates/공장용템플릿.xlsx

# 경고 표시: 운임표에 없는 상품이라 기본운임이 적용된 택배운임 셀(공장용/택배용 공통)
warning:
  fill: "FFFFA500"
  note: "운임표에 없는 상품 - 기본운임 적용됨 (확인 필요)"

# 택배사 구분: 중간파일 '택배사' 열의 값 (대소문자·앞뒤 공백 무시, 정확히 일치)
# CJ 주문은 기존 공장용 파일에서 빠지고, 같은 양식의 CJ용 공장 파일(파일명 뒤에 cj_suffix)로 따로 만든다.
# CJ 주문의 택배운임은 운임표와 무관하게 cj_fee 로 고정한다.
carriers:
  kyungdong: ["경동택배"]
  cj: ["CJ택배", "CJ대한통운"]
  cj_fee: 2000
  cj_suffix: "-CJ"

payment_term: "선불"        # 결제조건 (전체 고정)
option_joiner: ", "         # 상품옵션 = 선택사항 + 구분자 + 추가구성

# 택배운임: 위에서부터 검사, 처음 일치한 규칙의 fee 사용. 일치하는 규칙이 없으면 default_fee (+ 경고).
# 아래 금액은 모두 샘플값이다. 실제 운임표에 맞게 바꿔 쓴다. (조립 상태 / 모델 / 배송비)
# assembled:        true(완전조립) / false(미조립). 생략하면 조건 없음
# product_contains: 중간파일 상품명에 이 문구(모델명)가 들어 있어야 함 (생략 가능)
# 새 모델/운임은 해당 구역에 한 줄 추가하면 된다.
shipping_rules:
  - {assembled: true,  fee: 20000}                                # 완전조립: 모델 무관
  - {assembled: false, product_contains: "빅마운틴", fee: 10000}
  - {assembled: false, product_contains: "시애틀키즈18", fee: 8000}
  - {assembled: false, product_contains: "시애틀키즈20", fee: 10000}
  - {assembled: false, product_contains: "시애틀클래식18", fee: 8000}
  - {assembled: false, product_contains: "시애틀클래식20", fee: 10000}
  - {assembled: false, product_contains: "시애틀MT20", fee: 6000}
  - {assembled: false, product_contains: "시애틀MT22", fee: 7000}
  - {assembled: false, product_contains: "시애틀MT24", fee: 8000}
  - {assembled: false, product_contains: "시애틀GS20", fee: 10000}
  - {assembled: false, product_contains: "시애틀F26", fee: 12000}
  - {assembled: false, product_contains: "시애틀라인24", fee: 12000}
  - {assembled: false, product_contains: "시애틀라인26", fee: 14000}
  - {assembled: false, product_contains: "엑스퍼트", fee: 10000}
# 위 표에 없는 미조립 모델에 적용되는 기본값 (적용 시 경고가 나온다)
default_fee: 10000
